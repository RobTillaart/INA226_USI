    - attiny85  #  not supported
    # - uno
    # - due
    # - zero
    # - leonardo
    # - m4
    # - esp32
    # - esp8266
    # - mega2560
    # - rpipico

  libraries:
    #   libraries not registered?
    - "TinyWireM"
    - "TinyLiquidCrystal_I2C"
